<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">FPV Akademija</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">FPV Akademija</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Početna</a></li>
                        <li class="nav-item"><a class="nav-link" href="program.html">Kurikulum</a></li>
                        <li class="nav-item"><a class="nav-link active" href="kontakt.html">Prijava</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8">
                
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    Popust za rane prijave!
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <h2 class="mb-4 text-center">Prijava / Kontakt</h2>

                <form class="needs-validation" novalidate>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="name" placeholder="Ime i prezime" required>
                        <label for="name">Ime i prezime</label>
                        <div class="invalid-feedback">Molimo unesite ime i prezime.</div>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        <label for="email">Email adresa</label>
                        <div class="invalid-feedback">Molimo unesite valjanu email adresu.</div>
                    </div>

                    <div class="mb-3">
                        <select class="form-select" required>
                            <option selected disabled value="">Odaberite tečaj...</option>
                            <option>Sastavljanje drona</option>
                            <option>Sigurnost i propisi</option>
                            <option>Pilotiranje</option>
                        </select>
                        <div class="invalid-feedback">Molimo odaberite opciju.</div>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" placeholder="Poruka" id="message" style="height: 100px"></textarea>
                        <label for="message">Poruka</label>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="switchCheck" required>
                        <label class="form-check-label" for="switchCheck">Prihvaćam uvjete korištenja</label>
                        <div class="invalid-feedback">Morate prihvatiti uvjete.</div>
                    </div>

                    <button class="btn btn-success w-100" type="submit">Pošalji prijavu</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 FPV Akademija. Sva prava pridržana.</p>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadaća - Sigurna prijava</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="img.png" alt="Sigurnosna ikona">
    </header>

    <form action="https://origo.hr" method="post">
        <fieldset>
            <legend><b>Sigurna prijava</b></legend>
            
            <div class="podaci">
                <label for="ime">Korisničko ime</label>
                <input type="text" name="ime" id="ime" placeholder="admin">
                
                <label for="lozinka">Lozinka</label>
                <input type="password" name="lozinka" id="lozinka" placeholder="••••••">
            </div>
    
            <div class="checkbox">
                <input type="checkbox" name="zapamti" id="zapamti" value="zapamti">
                <label for="zapamti">Zapamti uređaj</label>
            </div>

            <button type="submit"><b>Prijavi se</b></button>
        </fieldset>
    </form>

    <div class="tablica">
        <table>
            <caption>Nedavne aktivnosti prijave</caption>
            <thead>
                <tr>
                    <th>IP adresa</th>
                    <th>Vrijeme</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>192.168.1.15</td>
                    <td>12:45</td>
                    <td style="color: green;">Uspjeh</td>
                </tr>
                <tr>
                    <td>10.0.0.52</td>
                    <td>Jučer</td>
                    <td style="color: red;">Greška</td>
                </tr>
                <tr>
                    <td>88.102.x.x</td>
                    <td>01.12.</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td class="cole" colspan="3">Prikaz zadnja 3 pokušaja</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

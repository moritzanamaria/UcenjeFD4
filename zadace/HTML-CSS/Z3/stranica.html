<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadaća</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
    <img src="img.png" alt="Sigurnosna ikona">
    </header>
    <form action="https://origo.hr" method="get">
        <fieldset>
            <legend><b>Sigurna prijava</b></legend>
            <div class="podaci">
                <p>Korisničko ime</p>
                <input type="text" name="ime" id="ime" placeholder="admin" style="font-size: medium;">
                <br>
                <p>Lozinka</p>
                <input type="password" name="lozinka" id="lozinka" placeholder="&bull;&bull;&bull;&bull;&bull;&bull; ">
            </div>
    
            <div class="checkbox">
                <input type="checkbox" name="zapamti" id="zapamti" value="zapamti">
                <label for="zapamti">Zapamti uređaj</label>
            </div>
            <br>


            <button><b>Prijavi se</b></button>

        </fieldset>
    </form>
<div class="tablica">
    <table>
        <caption>Nedavne aktivnosti prijave</caption>
        <colgroup>
            <col style="width: 35%;">
            <col style="width: 33%;">
            <col style="width: 32%;">
        </colgroup>
        <thead>
            <tr>
                <th>IP adresa</th>
                <th>Vrijeme</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>

            <tr>
                <td>192.168.1.15</td>
                <td>12:45</td>
                <td style="color: green;">Uspjeh</td>
            </tr>
            <tr>
                <td>10.0.0.52</td>
                <td>Jučer</td>
                <td style="color: red;">Greška</td>
            </tr>
            <tr>
                <td>88.102.x.x</td>
                <td>01.12.</td>
                <td rowspan="2"></td>
            </tr>
            <tr>

                <td class="cole" colspan="3">Prikaz zadnja 3 pokušaja</td>

            </tr>
        </tbody>
    </table>
</div>
</body>

</html>

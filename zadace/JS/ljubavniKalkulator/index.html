<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ljubavni kalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="kalkulator-container">
        <h1>Test ljubavi</h1>
        <p class="upute">Napiši svoje ime i ime svoje simpatije da saznaš koliko posto šanse imaš!</p>

        <div class="unos-podataka">
            <input type="text" id="ime1" placeholder="Tvoje ime">
            <span class="srce-ikona">❤️</span>
            <input type="text" id="ime2" placeholder="Ime simpatije">
        </div>

        <button id="izracunaj">Izračunaj</button>

        <div id="prikaz-imena"></div>
        <div id="rezultat"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>

<body>
    <div class="container">
        <form action="https://origo.hr" method="get">

            <h1>
                Novi Korisnik
            </h1>
            <div class="podaci">
                <p>Ime i Prezime</p>
                <input type="text" name="ime" id="ime" placeholder="npr. Ana Anić" style="font-size: medium;">
                <br>
                <p>Email adresa</p>
                <input type="text" name="email" id="email" placeholder="npr. ana@email.com">
            </div>
            <div class="select">
                <label for="uloga">Uloga</label> <br>
                <select name="uloga" id="uloga">
                    <option value="obicni">Obični korisnik</option>
                    <option value="neobicni">Neobični korisnik</option>
                </select>
            </div>
            <br>
            <button><b>Spremi Korisnika</b></button>

    </div>

    </form>

                    <th>Ime i prezime</th>
